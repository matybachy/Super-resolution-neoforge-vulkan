name: Vendor Vulkan stack sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone pinned renderer and shader-compatibility repositories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/vmr vendor/opalcompat
          git clone --depth 1 --branch main https://github.com/TrulyRin/VulkanMod-Reforged.git vendor/vmr
          git clone --depth 1 --branch claude-review https://github.com/matybachy/opal-shaders-compat.git vendor/opalcompat
          rm -rf vendor/vmr/.git vendor/opalcompat/.git

      - name: Commit vendored sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor
          git commit -m "Vendor Vulkan renderer and shader sources" || exit 0
          git push
